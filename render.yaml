services:
  - type: web
    name: iftakhar-memorial-hospital
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set real values in the Render dashboard (Environment tab).
      # Only VITE_-prefixed vars are exposed to the browser bundle.
      - key: VITE_HOSPITAL_PHONE
        sync: false
      - key: VITE_HOSPITAL_EMAIL
        sync: false
    # React Router uses client-side routing: every path must serve index.html,
    # otherwise deep links like /about or /donate return 404 on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
